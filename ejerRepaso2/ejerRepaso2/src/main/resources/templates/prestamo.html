<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Préstamo</title>
</head>
<body>

<form action="/prestamo" method="post">

  <label for="libroId"> ID de libro:</label>
  <input type="number" name="libroId" id="libroId" required>

  <label for="nombreSocio"> Nombre del socio:</label>

  <label for="diasPrestamo">Dias de prestamo:</label>

  <button type="submit">Enviar</button>
</form>

</body>
</html>
